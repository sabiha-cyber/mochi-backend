spring.datasource.url=jdbc:h2:mem:mochi_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Tests build the schema straight from the entities; Flyway (MySQL SQL) is skipped.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.open-in-view=false
mochi.cors.allowed-origins=http://localhost:*

# Never resolved because FirebaseApp is mocked in tests, but the property must exist.
firebase.credentials.path=not-used-in-tests.json
