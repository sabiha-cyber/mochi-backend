spring.application.name=mochi-backend
firebase.credentials.path=firebase/serviceAccountKey.json

# Loads application-local.properties (gitignored) if present, e.g. for LiveKit secrets.
# See application-local.properties.example for what goes in it.
spring.profiles.active=local

# CORS - pattern-based so Vite's auto-incrementing dev port (5173, 5174, ...) doesn't break requests.
# Comma-separated list of origin PATTERNS (Spring AntPathMatcher syntax), not exact origins.
mochi.cors.allowed-origins=http://localhost:*

# Internal ops (v2 backlog: manual counter-reconciliation trigger).
# Not a user-facing feature and deliberately not gated by Firebase auth
# or a per-community role — this app has no site-wide admin concept yet
# (only per-community MEMBER/MODERATOR/ADMIN), so InternalOpsController
# checks this shared secret directly instead. Empty by default, which
# the controller treats as "disabled" rather than "open to anyone" -
# see that class's javadoc. Set via an environment variable in any real
# deployment; never commit a real value here.
mochi.ops.reconciliation-key=${RECONCILIATION_TRIGGER_KEY:}

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/mochi_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

# Render (and most cloud hosts) tell the app which port to listen on via
# the PORT env var. Locally, PORT isn't set, so this falls back to 8080.
server.port=${PORT:8080}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# LiveKit (Study Rooms Phase 3 — video/audio). Blank until a LiveKit Cloud
# (or self-hosted) project exists; VideoTokenController returns 503 until
# all three are set. api-secret must stay out of any committed file in
# real deployments — set it via the LIVEKIT_API_SECRET env var, never here.
livekit.api-key=${LIVEKIT_API_KEY:}
livekit.api-secret=${LIVEKIT_API_SECRET:}
livekit.ws-url=${LIVEKIT_WS_URL:}

# Flashcards - File Upload
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Flashcards - AI (Hugging Face is @Primary; Groq stays wired as a
# fallback — see HuggingFaceFlashcardGenerationClient's javadoc for
# how to switch back)
mochi.ai.huggingface.api-key=${HF_TOKEN:}
mochi.ai.huggingface.model=meta-llama/Llama-3.1-8B-Instruct

mochi.ai.openai.api-key=${GROQ_API_KEY:}
mochi.ai.openai.model=llama-3.3-70b-versatile
